name: Render Riverbank Rescue prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stick_animate.py"
      - "production_agents.py"
      - "character_rigs.py"
      - "motion_engine.py"
      - "camera_director.py"
      - "transition_director.py"
      - "demo/motion-engine-showcase.json"
      - "demo/cinematic-camera-transitions.json"
      - "scene_designer.py"
      - "audio_director.py"
      - "sound_effect_finder.py"
      - "demo/riverbank-rescue.json"
      - "demo/forest-friends-ensemble.json"
      - "demo/last-train-storm-rescue.json"
      - "demo/human-psychology-overthinking.json"
      - "tests/**"
      - ".github/workflows/render-riverbank-prototype.yml"

permissions:
  contents: read

concurrency:
  group: riverbank-rescue-prototype
  cancel-in-progress: true

jobs:
  render-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run all engine tests
        run: python -m unittest discover -s tests -v

      - name: Render new Riverbank Rescue test (no AI API required)
        run: |
          STICK_ANIMATE_OFFLINE_AUDIO=1 python stick_animate.py --script demo/riverbank-rescue.json --output output/riverbank-rescue.mp4
          test -s output/riverbank-rescue.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/riverbank-rescue.mp4

      - name: Render nine-character ensemble test
        run: |
          STICK_ANIMATE_OFFLINE_AUDIO=1 python stick_animate.py --script demo/forest-friends-ensemble.json --output output/forest-friends-ensemble.mp4
          test -s output/forest-friends-ensemble.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/forest-friends-ensemble.mp4

      - name: Render original rainy railway rescue script
        run: |
          STICK_ANIMATE_OFFLINE_AUDIO=1 python stick_animate.py --script demo/last-train-storm-rescue.json --output output/last-train-storm-rescue.mp4
          test -s output/last-train-storm-rescue.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/last-train-storm-rescue.mp4

      - name: Render multidirectional character motion showcase
        run: |
          STICK_ANIMATE_OFFLINE_AUDIO=1 python stick_animate.py --script demo/motion-engine-showcase.json --output output/motion-engine-showcase.mp4
          test -s output/motion-engine-showcase.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/motion-engine-showcase.mp4

      - name: Render cinematic camera and transitions showcase
        run: |
          STICK_ANIMATE_OFFLINE_AUDIO=1 python stick_animate.py --script demo/cinematic-camera-transitions.json --output output/cinematic-camera-transitions.mp4
          test -s output/cinematic-camera-transitions.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/cinematic-camera-transitions.mp4

      - name: Render human psychology documentary test
        run: |
          STICK_ANIMATE_OFFLINE_AUDIO=1 python stick_animate.py --script demo/human-psychology-overthinking.json --output output/human-psychology-overthinking.mp4
          test -s output/human-psychology-overthinking.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/human-psychology-overthinking.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of json output/human-psychology-overthinking.mp4

      - name: Upload prototype video and review assets
        uses: actions/upload-artifact@v4
        with:
          name: riverbank-rescue-prototype-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish result
        run: |
          {
            echo "## Riverbank Rescue prototype rendered"
            echo ""
            echo "This is a fresh 18-second test script with human, monkey, turtle and bear rigs plus automatically searched, commercially usable, attributed sound effects for forest ambience, flowing water, footsteps, jumps and branch movement."
            echo "The artifact also includes the audio cue plan, sound-effect attribution manifest, a nine-character ensemble stress test, and an original rainy railway rescue story."
          } >> "$GITHUB_STEP_SUMMARY"
