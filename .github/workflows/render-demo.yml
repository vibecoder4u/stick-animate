name: Render Stick Animate demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stick-animate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run engine tests
        run: python -m unittest discover -s tests -v

      - name: Validate animation script
        run: python stick_animate.py --story-file demo/empty_platform_story.txt --duration 30 --title "THE EMPTY PLATFORM" --output output/designed-empty-platform.mp4 --validate-only

      - name: Render MP4 on GitHub runner
        run: python stick_animate.py --story-file demo/empty_platform_story.txt --duration 30 --title "THE EMPTY PLATFORM" --output output/designed-empty-platform.mp4

      - name: Verify generated video
        run: |
          test -s output/designed-empty-platform.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/designed-empty-platform.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of json output/designed-empty-platform.mp4
          test -s output/audio-cues.json
          python -c 'import json; c=json.load(open("output/audio-cues.json")); assert c and all(x.get("evidence") for x in c); print("Verified scene-grounded audio cues:", [x["event"] for x in c])'

      - name: Upload rendered video and poster
        uses: actions/upload-artifact@v4
        with:
          name: stick-animate-scene-designer-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
