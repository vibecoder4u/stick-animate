name: Render Stick Animate demo

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      story:
        description: "Paste the complete story/script to animate"
        required: true
        type: string
      title:
        description: "Video title"
        required: false
        type: string
        default: "My Animated Story"
      duration:
        description: "Video duration in seconds"
        required: false
        type: number
        default: 30

permissions:
  contents: read

concurrency:
  group: stick-animate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run engine tests
        run: python -m unittest discover -s tests -v

      - name: Prepare story input
        if: github.event_name == 'workflow_dispatch'
        env:
          STORY_TEXT: ${{ inputs.story }}
        run: |
          test -n "$STORY_TEXT"
          printf '%s' "$STORY_TEXT" > input-story.txt

      - name: Validate animation script
        if: github.event_name == 'workflow_dispatch'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VIDEO_TITLE: ${{ inputs.title || 'THE EMPTY PLATFORM' }}
          VIDEO_DURATION: ${{ inputs.duration || 30 }}
        run: python stick_animate.py --story-file input-story.txt --duration "$VIDEO_DURATION" --title "$VIDEO_TITLE" --output output/animated-story.mp4 --validate-only

      - name: Render MP4 on GitHub runner
        if: github.event_name == 'workflow_dispatch'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          VIDEO_TITLE: ${{ inputs.title || 'THE EMPTY PLATFORM' }}
          VIDEO_DURATION: ${{ inputs.duration || 30 }}
        run: python stick_animate.py --story-file input-story.txt --duration "$VIDEO_DURATION" --title "$VIDEO_TITLE" --output output/animated-story.mp4

      - name: Verify generated video
        if: github.event_name == 'workflow_dispatch'
        run: |
          test -s output/animated-story.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate -of json output/animated-story.mp4
          ffprobe -v error -select_streams a:0 -show_entries stream=codec_name,sample_rate,channels -of json output/animated-story.mp4
          test -s output/audio-cues.json
          python -c 'import json; c=json.load(open("output/audio-cues.json")); assert c and all(x.get("evidence") for x in c); print("Verified scene-grounded audio cues:", [x["event"] for x in c])'

      - name: Upload rendered video and poster
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: stick-animate-scene-designer-${{ github.run_number }}
          path: output/*
          if-no-files-found: error
          retention-days: 30
